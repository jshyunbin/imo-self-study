<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>BVH Player</title>
    <style>
      body { margin: 0; width: 100%; height: 100%}
      #control_dock {
          position: absolute;
          top: 10px;
          left: 10px;
          background-color: white;
          font-size: 15px;
          width: 200px;
          text-align: left;
          z-index: 100;
          display: flex;
          flex-direction: column;
      }
      .lists {
        border: 1px solid #000000;
        padding: 5px;
      }
      .controls {
        display: flex;
        justify-content: space-around;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/main.js"></script>
    <div id="control_dock">
      <div class="lists">Controls</div>
      <div class="lists">
        <div>Select File</div>
        <input type="file" id="bvh_file" accept=".bvh">
      </div>
      <div class="lists controls">
        <div id="start">Start</div>
        <div id="stop">Stop</div>
      </div>
      <div id="message"></div>
    </div>
  </body>
</html>
