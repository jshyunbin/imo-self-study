<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>BVH Player</title>
    <style>body{width:100%;height:100%;margin:0}#control_dock{text-align:left;z-index:100;background-color:#fff;flex-direction:column;width:200px;font-size:15px;display:flex;position:absolute;top:10px;left:10px}#slider{width:100%}.lists{border:1px solid #000;padding:5px}.controls{justify-content:space-around;display:flex}</style>
    <script type="module" crossorigin src="/assets/index-JoC4GTat.js"></script>
  </head>
  <body>
    <div id="control_dock">
      <div class="lists">Controls</div>
      <div class="lists">
        <div>Select File</div>
        <input type="file" id="bvh_file" accept=".bvh">
      </div>
      <div class="lists controls">
        <div id="start">Start</div>
        <div id="stop">Stop</div>
      </div>
      <div id="message"></div>
      <div class="lists">
        <input id="slider" type="range" min="0" max="100" value="0">
      </div>
    </div>
  </body>
</html>
